apiVersion: agones.dev/v1
kind: GameServer
metadata:
  generateName: tag-duels-server
spec:
  ports:
    - name: default
      portPolicy: Dynamic
      containerPort: 7777
  template:
    spec:
      containers:
        - name: tag-duels-server
          image: tag-duels-server:latest
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 100m
