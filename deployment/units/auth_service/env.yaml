apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-env
data:
  LISTEN_ADDRESS: "0.0.0.0:50001"
  HTTP_LISTEN_ADDRESS: "0.0.0.0:8080"
  REDIS_ADDR: "auth-kv:6379"
  REDIS_DB: "0"
  REDIS_DIAL_TIMEOUT: "5s"
  REDIS_READ_TIMEOUT: "5s"
  REDIS_WRITE_TIMEOUT: "5s"
  JWT_ISSUER: "tag-duels-auth"
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "168h"
  PRIMARY_PRIVATE_KEY_PATH: "/secrets/keys/primary_private.pem"
  PRIMARY_PUBLIC_KEY_PATH: "/secrets/keys/primary_public.pem"
  SECONDARY_PRIVATE_KEY_PATH: "/secrets/keys/secondary_private.pem"
  SECONDARY_PUBLIC_KEY_PATH: "/secrets/keys/secondary_public.pem"
