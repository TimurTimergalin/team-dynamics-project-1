apiVersion: v1
kind: ConfigMap
metadata:
  name: user-event-env
data:
  REDIS_ADDR: "user-kv:6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "5"
  REDIS_MIN_IDLE_CONNS: "2"
  REDIS_DIAL_TIMEOUT: "5s"
  REDIS_READ_TIMEOUT: "5s"
  REDIS_WRITE_TIMEOUT: "5s"
  REDIS_POOL_TIMEOUT: "3s"
  LISTEN_ADDRESS: "0.0.0.0:8080"
  MATCH_SERVICE_ADDRESS: "match-service:50001"
  MATCH_HISTORY_SERVICE_V2_ADDRESS: "match-history-service-v2:50001"
  USER_SERVICE_ADDRESS: "user-service-service:50001"
  CHANNEL_SIZES: "100"
  CHECK_STATUS_PERIOD: "1s"
