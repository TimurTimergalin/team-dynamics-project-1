apiVersion: v1
kind: Pod
metadata:
  name: user-event
  labels:
    app: user-event
spec:
  containers:
    - name: user-event
      image: user-event-server:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
          name: websockets
      envFrom:
        - configMapRef:
            name: user-event-env
      env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: user-kv-credentials
              key: REDIS_PASSWORD
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
  restartPolicy: Always
