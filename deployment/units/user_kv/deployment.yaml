apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-kv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-kv
  template:
    metadata:
      labels:
        app: user-kv
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/redis
        - name: data
          mountPath: /data
        env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: user-kv-credentials
                key: REDIS_PASSWORD
        command:
          - /bin/sh
          - -c
          - |
            redis-server /usr/local/etc/redis/redis.conf --requirepass $REDIS_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: user-kv-config
      - name: data
        persistentVolumeClaim:
          claimName: user-kv-data
