  REDIS_WRITE_TIMEOUT: "5s"
  REDIS_POOL_TIMEOUT: "3s"
  MATCH_SERVICE_LISTEN_ADDRESS: "0.0.0.0:50001"
  FLEET_MANAGER_ADDRESS: "fleet-manager-service.fleet.svc.cluster.local:50001"
  RATING_SERVICE_ADDRESS: "rating-service-service.rating.svc.cluster.local:50001"
  MATCH_HISTORY_SERVICE_ADDRESS: "match-history-service-service.match-history.svc.cluster.local:50001"
