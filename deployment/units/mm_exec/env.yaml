apiVersion: v1
kind: ConfigMap
metadata:
  name: mm-exec-env
data:
  MM_LOCK_TIMEOUT_MILLIS: "10000"
  MM_LOCK_ACQUIRE_TIMEOUT_MILLIS: "10000"
  MM_SCHEDULING_PERIOD_MILLIS: "5000"
  MM_MATCH_SERVICE_ADDRESS: "match-service:50001"
  REDIS_HOST: "mm-pool"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_MAX_CONNECTIONS: "10"
  REDIS_SOCKET_CONNECT_TIMEOUT: "10"
  REDIS_SOCKET_TIMEOUT: "10"
  REDIS_RETRY_NUMBER: "3"
