apiVersion: v1
kind: Pod
metadata:
  name: match-history-service
  namespace: match-history
  labels:
    app: match-history-service
spec:
  containers:
    - name: match-history-service
      image: match-history-service-server:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 50001
          name: grpc
      envFrom:
        - configMapRef:
            name: match-history-service-env
      env:
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: match-history-storage-credentials
              key: POSTGRES_USER
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: match-history-storage-credentials
              key: POSTGRES_PASSWORD
        - name: PG_DATABASE
          valueFrom:
            configMapKeyRef:
              name: match-history-storage-config
              key: POSTGRES_DB
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      livenessProbe:
        tcpSocket:
          port: 50001
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        tcpSocket:
          port: 50001
        initialDelaySeconds: 5
        periodSeconds: 10
  restartPolicy: Always
