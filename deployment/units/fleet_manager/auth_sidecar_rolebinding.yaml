apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-manager-auth-sidecar-rolebinding
subjects:
  - kind: ServiceAccount
    name: fleet-manager-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: auth-sidecar-role
  apiGroup: rbac.authorization.k8s.io
