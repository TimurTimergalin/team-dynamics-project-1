apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-manager-env
data:
  LISTEN_ADDRESS: "0.0.0.0:50001"
  OPS_WRITE_TIMEOUT: "3s"
  OPS_READ_TIMEOUT: "3s"
  OPS_NAMESPACE: "default"
  OPS_COMMON_FLEET_LABEL_KEY: "is-game-server"
  OPS_COMMON_FLEET_LABEL_VALUE: "true"
  OPS_ALLOC_STRATEGY: "Distributed"
  OPS_CONNECTION_RETRIES: "2"
  OPS_CONTENTION_RETRIES: "3"
  OPS_UNKNOWN_RETRIES: "1"
