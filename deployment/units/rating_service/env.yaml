apiVersion: v1
kind: ConfigMap
metadata:
  name: rating-service-env
data:
  PG_HOST: "rating-storage-service"
  PG_PORT: "5432"
  PG_SSLMODE: "disable"
  PG_CONN_TIMEOUT: "1s"
  PG_RETRIES: "3"
  PG_MAX_CONNS: "5"
  PG_MIN_CONNS: "1"
  PG_MAX_CONN_LIFETIME: "10m"
  PG_MAX_CONN_IDLE_TIME: "2m"
  PG_HEALTH_CHECK_PERIOD: "30s"
  LISTEN_ADDRESS: "0.0.0.0:50001"
  HTTP_LISTEN_ADDRESS: "0.0.0.0:8080"
  AUTH_SIDECAR_ADDRESS: "127.0.0.1:50002"
