apiVersion: v1
kind: ConfigMap
metadata:
  namespace: matchmaking
  name: mm-event-env
data:
  REDIS_ADDR: "mm-pool:6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "5"
  REDIS_MIN_IDLE_CONNS: "2"
  REDIS_DIAL_TIMEOUT: "5s"
  REDIS_READ_TIMEOUT: "5s"
  REDIS_WRITE_TIMEOUT: "5s"
  REDIS_POOL_TIMEOUT: "3s"
  LISTEN_ADDRESS: "0.0.0.0:50001"
  MATCH_SERVICE_ADDRESS: "match-service.match.svc.cluster.local"
  RATING_SERVICE_ADDRESS: "rating-service-service.rating.svc.cluster.local"
  USER_SERVICE_ADDRESS: "user-service.user.svc.cluster.local"
  CHANNEL_SIZES: "100"
