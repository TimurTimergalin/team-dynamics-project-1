apiVersion: v1
kind: Pod
metadata:
  name: fleet-manager-server
  namespace: default
  labels:
    app: fleet-manager
spec:
  containers:
    - name: fleet-manager
      image: fleet-manager-server:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 50001
          name: grpc
      env:
        - name: CLUSTER_NAMESPACE
          value: "default"
        - name: FLEET_NAME
          value: "simple-game-server"
        - name: STRATEGY
          value: "Packed"
        - name: K8S_TIMEOUT_MILLIS
          value: "10000"
        - name: LISTEN_ON
          value: ":50001"
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      livenessProbe:
        tcpSocket:
          port: 50001
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        tcpSocket:
          port: 50001
        initialDelaySeconds: 5
        periodSeconds: 10
  restartPolicy: Always